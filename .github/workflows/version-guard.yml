name: version guard

# A tag is a promise that this commit is what runs in production. The guard keeps
# the promise checkable: the tag, package.json and CHANGELOG.md must agree.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/version-guard.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: CHANGELOG has a section for this version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"

          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "pull request: checking that CHANGELOG.md is parseable"
            head -1 CHANGELOG.md | grep -qx '# Changelog'
            exit 0
          fi

          # Pre-release tags are staging and are not published, so they may point
          # at a version the manifest has not bumped yet.
          if [[ "$tag" == *-* ]]; then
            echo "pre-release ${GITHUB_REF_NAME}: manifest match not required"
            exit 0
          fi

          if [[ "$tag" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json and CHANGELOG.md"
