name: docker smoke

# The image is built on the host by deploy.sh, so a broken Dockerfile would only
# surface at release. Build it here when something that feeds it changes.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - docker-compose.yml

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image without pushing it
        run: docker build -t dee-idleclans-helper:smoke .
