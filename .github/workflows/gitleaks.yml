name: gitleaks

# Secrets, in the diff and in the history. The default branch protection requires
# this check, so a leak stops the merge instead of being found later.
on:
  pull_request:
  push:
    branches: [develop, production]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: gitleaks walks every commit, not just the tip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # read-only token: no PR comment, the failing check is the signal
          GITLEAKS_ENABLE_COMMENTS: false
